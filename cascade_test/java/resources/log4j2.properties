# cascade-test engine: Flink logs go to stderr at WARN so the protocol channel stays clean
rootLogger.level = WARN
rootLogger.appenderRef.err.ref = err
appender.err.type = Console
appender.err.name = err
appender.err.target = SYSTEM_ERR
appender.err.layout.type = PatternLayout
appender.err.layout.pattern = %d{HH:mm:ss.SSS} %-5level %c{1} - %msg%n
logger.akka.name = org.apache.pekko
logger.akka.level = ERROR
logger.metrics.name = org.apache.flink.runtime.metrics
logger.metrics.level = ERROR
