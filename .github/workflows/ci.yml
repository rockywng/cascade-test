name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLINK_VERSION: "2.3.0"

jobs:
  unit:
    name: framework (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out cascade-dsl (private; needs the CASCADE_DSL_TOKEN secret)
        uses: actions/checkout@v4
        with:
          repository: rockywng/cascade-dsl
          path: pipedsl
          token: ${{ secrets.CASCADE_DSL_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ./pipedsl -e '.[test]'
      - name: Lint
        run: pyflakes cascade_test tests
      - name: Unit tests (Flink-backed tests skip without FLINK_HOME)
        run: python -m pytest tests -q

  flink:
    name: against Flink ${{ matrix.flink }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flink: ["2.3.0"]   # cascade-dsl needs Flink 2.3+; add versions here as they are supported
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rockywng/cascade-dsl
          path: pipedsl
          token: ${{ secrets.CASCADE_DSL_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Flink
        id: flink-cache
        uses: actions/cache@v4
        with:
          path: ~/flink-${{ matrix.flink }}
          key: flink-${{ matrix.flink }}
      - name: Download Flink
        if: steps.flink-cache.outputs.cache-hit != 'true'
        run: |
          f="flink-${{ matrix.flink }}/flink-${{ matrix.flink }}-bin-scala_2.12.tgz"
          for url in "https://dlcdn.apache.org/flink/$f" "https://archive.apache.org/dist/flink/$f"; do
            curl -fsSL --retry 5 --retry-all-errors -o /tmp/flink.tgz "$url" && break
          done
          tar xzf /tmp/flink.tgz -C ~
      - name: Install, and build cascade-dsl's JVM jars
        run: |
          pip install -e ./pipedsl -e '.[test]'
          FLINK_HOME=~/flink-${{ matrix.flink }} pipedsl/runtime/build.sh
      - name: Doctor
        run: FLINK_HOME=~/flink-${{ matrix.flink }} cascade-test doctor
      - name: Framework tests, including real Flink jobs
        run: FLINK_HOME=~/flink-${{ matrix.flink }} python -m pytest tests -q
      - name: Example suite (CLI, with coverage)
        run: |
          FLINK_HOME=~/flink-${{ matrix.flink }} cascade-test run examples/orders --ci --coverage --min-coverage 100 \
            --junit target/junit.xml
      - name: Example suite (pytest plugin)
        run: FLINK_HOME=~/flink-${{ matrix.flink }} python -m pytest examples/orders -q --cascade-ci
      - name: cascade-dsl's own examples run unchanged
        run: FLINK_HOME=~/flink-${{ matrix.flink }} cascade-test run pipedsl/examples/orders pipedsl/examples/orders_py pipedsl/examples/clickstream_py
      - name: Replay is deterministic (a version against itself)
        run: |
          FLINK_HOME=~/flink-${{ matrix.flink }} cascade-test replay examples/orders \
            --recording examples/orders/recordings/2026-11-06 --baseline examples/orders
